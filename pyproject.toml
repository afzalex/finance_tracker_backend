[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-tracker"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
# The `backend` package lives one level up from this file (finance-tracker/).
where = [".."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
