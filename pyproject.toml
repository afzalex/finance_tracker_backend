[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-tracker"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
# The `backend` package lives one level up from this file (finance-tracker/).
where = [".."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

# Coverage for the installable ``backend`` package (run from this directory: ``make coverage``).
[tool.coverage.run]
branch = true
source_pkgs = ["backend"]
omit = [
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
