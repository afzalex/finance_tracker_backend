# ── Finance Tracker — Deployment Workflow ─────────────────────────────────────
#
# Runs on every push to the trigger branch (see `on.push.branches` below).
# Use `scratch` while testing; switch to `main` for production.
#
# Jobs (in order):
#   test           — install deps, run pytest
#   build-and-push — build Docker image (non-prod: local only; prod: push to registry)
#   deploy         — run container (non-prod: on runner's docker host; prod: via SSH)
#
# ── Secrets ────────────────────────────────────────────────────────────────────
#
# Optional (non-prod + prod):
#   DEPLOY_NETWORK      Docker network to attach the container to (--network).
#                       Omit to use Docker's default network.
#   DEPLOY_SECRETS_DIR  Host path mounted as /app/backend/secrets inside the container.
#                       Holds credentials.json and token.json for Gmail OAuth.
#                       Defaults to /opt/finance-tracker/secrets if unset.
#   DEPLOY_DATA_DIR     Host path mounted as /app/backend/data inside the container.
#                       Holds the SQLite database file.
#                       Defaults to /opt/finance-tracker/data if unset.
#
# Production only (uncomment the prod blocks below before use):
#   REGISTRY_USER   Gitea username for container registry login
#   REGISTRY_TOKEN  Gitea access token with package:write scope
#   DEPLOY_HOST     SSH host of the deployment server
#   DEPLOY_USER     SSH user on the deployment server
#   DEPLOY_KEY      SSH private key for the deployment server
#
# ── Volume mounts ──────────────────────────────────────────────────────────────
#
#   Host path                        Container path           Purpose
#   /opt/finance-tracker/data        /app/backend/data        SQLite DB (persists across restarts)
#   $DEPLOY_SECRETS_DIR              /app/backend/secrets     Gmail OAuth credentials + token
#
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches:
      - deploy

env:
  REGISTRY: gitea.afzalex.com
  IMAGE: gitea.afzalex.com/fzsystems/finance_tracker_backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pyproject.toml uses where=[".."] to find the 'backend' package, expecting
          # the repo to live in a parent dir as 'backend/'. Symlink to satisfy that.
          ln -sf $GITHUB_WORKSPACE $(dirname $GITHUB_WORKSPACE)/backend
          pip install -e .

      - name: Run tests
        run: python -m pytest tests/

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Production: log in to Gitea container registry and push.
      # docker/login-action runs `docker login <registry>` without exposing
      # credentials in shell history or logs.
      #
      # - name: Log in to Gitea container registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ env.REGISTRY }}
      #     username: ${{ secrets.REGISTRY_USER }}
      #     password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Prepare build context
        # The Dockerfile expects a backend/ subdirectory (monorepo layout).
        # Since this repo root IS the backend, we mirror that structure in a temp dir.
        run: |
          mkdir -p /tmp/buildctx
          cp -r . /tmp/buildctx/backend
          cp Dockerfile /tmp/buildctx/
          cp .env.example /tmp/buildctx/

      - name: Build and push
        # Production: uses docker/build-push-action to push to registry with caching.
        #
        # uses: docker/build-push-action@v5
        # with:
        #   context: /tmp/buildctx
        #   file: Dockerfile
        #   push: true
        #   tags: |
        #     ${{ env.IMAGE }}:latest
        #     ${{ env.IMAGE }}:${{ github.sha }}
        #   cache-from: type=registry,ref=${{ env.IMAGE }}:latest
        #   cache-to: type=inline
        #
        # Non-prod: build locally on the runner's docker host (no push).
        run: docker build -t ${{ env.IMAGE }}:latest /tmp/buildctx

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH deploy
        # Production: SSH into the deployment server, pull image, and restart container.
        #
        # uses: appleboy/ssh-action@v1
        # with:
        #   host: ${{ secrets.DEPLOY_HOST }}
        #   username: ${{ secrets.DEPLOY_USER }}
        #   key: ${{ secrets.DEPLOY_KEY }}
        #   script: |
        #     docker pull ${{ env.IMAGE }}:latest
        #     docker stop finance-tracker || true
        #     docker rm   finance-tracker || true
        #     docker run -d \
        #       --name finance-tracker \
        #       --restart unless-stopped \
        #       --env-file /opt/finance-tracker/.env \
        #       -v /opt/finance-tracker/data:/app/data \
        #       -v /opt/finance-tracker/secrets:/app/secrets \
        #       -p 8000:8000 \
        #       ${{ env.IMAGE }}:latest
        #
        # Non-prod: run the locally built image directly on the runner's docker host.
        run: |
          echo "[debug] secrets.DEPLOY_SECRETS_DIR=${{ secrets.DEPLOY_SECRETS_DIR }}"
          echo "[debug] secrets.DEPLOY_DATA_DIR=${{ secrets.DEPLOY_DATA_DIR }}"
          echo "[debug] secrets.DEPLOY_NETWORK=${{ secrets.DEPLOY_NETWORK }}"
          echo "[debug] vars.DEPLOY_SECRETS_DIR=${{ vars.DEPLOY_SECRETS_DIR }}"
          echo "[debug] vars.DEPLOY_DATA_DIR=${{ vars.DEPLOY_DATA_DIR }}"
          echo "[debug] vars.DEPLOY_NETWORK=${{ vars.DEPLOY_NETWORK }}"

          SECRETS_DIR="${{ vars.DEPLOY_SECRETS_DIR }}"
          SECRETS_DIR="${SECRETS_DIR:-/opt/finance-tracker/secrets}"
          DATA_DIR="${{ vars.DEPLOY_DATA_DIR }}"
          DATA_DIR="${DATA_DIR:-/opt/finance-tracker/data}"

          NETWORK_ARG=""
          if [ -n "${{ vars.DEPLOY_NETWORK }}" ]; then
            NETWORK_ARG="--network ${{ vars.DEPLOY_NETWORK }}"
          fi

          echo "[debug] resolved SECRETS_DIR=$SECRETS_DIR"
          echo "[debug] resolved DATA_DIR=$DATA_DIR"
          echo "[debug] resolved NETWORK_ARG=$NETWORK_ARG"

          mkdir -p "$DATA_DIR" "$SECRETS_DIR"
          docker stop finance-tracker || true
          docker rm   finance-tracker || true
          docker run -d \
            --name finance-tracker \
            --restart unless-stopped \
            $NETWORK_ARG \
            -v "$DATA_DIR":/app/backend/data \
            -v "$SECRETS_DIR":/app/backend/secrets \
            -p 8001:8000 \
            ${{ env.IMAGE }}:latest
